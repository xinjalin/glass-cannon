<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glass Cannon history</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="panel.css">
  <link rel="stylesheet" href="window.css">
</head>
<body data-panel="history">
  <main id="panel">
    <header id="bar" data-tauri-drag-region>
      <span class="brand" data-tauri-drag-region>fight history</span>
      <span id="count" class="note" data-tauri-drag-region></span>
      <span class="lights">
        <button id="pin" type="button" class="light green" title="Kept on top · click to let other windows cover it" aria-label="Keep on top" aria-pressed="true"></button>
        <button id="close" type="button" class="light red" title="Close (Esc)" aria-label="Close"></button>
      </span>
    </header>
    <nav id="tabs" class="tabs" role="tablist" aria-label="Show">
      <button type="button" role="tab" data-tab="all">[all]</button>
      <button type="button" role="tab" data-tab="runs">[dungeon runs]</button>
      <button type="button" role="tab" data-tab="raids" title="Raids (Sanctuaries): their runs and boss attempts">[raids]</button>
      <button type="button" role="tab" data-tab="bosses">[bosses]</button>
      <button type="button" role="tab" data-tab="pvp">[pvp]</button>
      <button type="button" role="tab" data-tab="dummy" title="Your training dummy runs (dummy mode)">[dummy]</button>
    </nav>
    <div class="scroll">
      <ol id="list" class="list"></ol>
      <p id="empty" class="empty" hidden></p>
    </div>
    <div class="history-foot">
      <p id="hint" class="note">click: show on the meter · right-click: analysis</p>
      <span class="foot-buttons">
        <button id="open-attempts" type="button" title="Every character's tries at each dungeon and raid boss: kills, wipes, the best wipe, the fastest kill">[attempts]</button>
        <button id="clear" type="button" title="Delete every fight, dungeon run and PvP session in the history (not the attempts)">[clear]</button>
      </span>
      <span id="clear-ask" class="clear-ask" hidden>
        clear every fight, dungeon run and PvP session?
        <button id="clear-yes" type="button" class="danger">[yes]</button>
        <button id="clear-no" type="button">[no]</button>
      </span>
    </div>
  </main>
  <script src="theme.js"></script>
  <script src="window.js"></script>
  <script src="panel.js"></script>
  <script src="history.js"></script>
</body>
</html>
