<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glass Cannon history</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="panel.css">
</head>
<body data-panel="history">
  <main id="panel">
    <header id="bar" data-tauri-drag-region>
      <span class="brand" data-tauri-drag-region>─ fight history</span>
      <span id="count" class="note" data-tauri-drag-region></span>
      <button id="close" type="button" class="close" title="Close (Esc)">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg>
      </button>
    </header>
    <nav id="tabs" class="tabs" role="tablist" aria-label="Show">
      <button type="button" role="tab" data-tab="all">[all]</button>
      <button type="button" role="tab" data-tab="runs">[dungeon runs]</button>
      <button type="button" role="tab" data-tab="bosses">[bosses]</button>
      <button type="button" role="tab" data-tab="pvp">[pvp]</button>
    </nav>
    <div class="scroll">
      <ol id="list" class="list"></ol>
      <p id="empty" class="empty" hidden></p>
    </div>
    <p class="note">click: show on the meter · right-click: analysis</p>
  </main>
  <script src="theme.js"></script>
  <script src="panel.js"></script>
  <script src="history.js"></script>
</body>
</html>
