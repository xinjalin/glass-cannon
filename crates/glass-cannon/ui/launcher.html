<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glass Cannon</title>
  <link rel="stylesheet" href="launcher.css">
</head>
<body>
  <!-- The window the app opens to, laid out like a music player: a cover on the left, what's
       going on as a track list on the right (the window's lights at its top right, in
       Windows' order), and a control bar
       under both (analysis, the overlay's start/stop, history; arrange, settings). Its
       colours are its own, whatever the theme. Text too long for its line slides along
       rather than being cut off. Drag it by any bare spot. -->
  <main id="app">
    <aside id="side" data-tauri-drag-region>
      <!-- The cover: the app's mark (a cut glass gem), its name, and what it's doing. -->
      <button id="cover" type="button" title="Analysis of the fight going on, or the last one">
        <span class="cover-title">GLASS CANNON</span>
        <span class="cover-sub">aion 2 · dps meter</span>
        <span id="cover-dot" class="cover-dot"></span>
        <svg class="gem" viewBox="0 0 64 64" aria-hidden="true">
          <path class="facet" d="M22 14L27 24H14zM42 14L50 24H37zM27 24L32 54L14 24z"/>
          <path d="M22 14H42L50 24L32 54L14 24zM14 24H50M22 14L27 24L32 14L37 24L42 14M27 24L32 54L37 24"/>
        </svg>
        <span id="cover-status" class="cover-status"></span>
      </button>
    </aside>

    <section id="list" data-tauri-drag-region>
      <div class="lights">
        <button id="min" type="button" class="light yellow" title="Minimise" aria-label="Minimise"></button>
        <button id="pin" type="button" class="light green" title="Keep on top" aria-label="Keep on top" aria-pressed="false"></button>
        <button id="close" type="button" class="light red" title="Close Glass Cannon" aria-label="Close"></button>
      </div>
      <ol id="rows" data-tauri-drag-region></ol>
    </section>

    <footer id="bar">
      <div id="progress"><span id="progress-fill"></span></div>
      <div class="controls">
        <button id="analysis" type="button" class="icon" title="Analysis of the fight going on, or the last one">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 13.5h11M4.5 11V8M7.5 11V4.5M10.5 11V6.5"/></svg>
        </button>
        <button id="toggle" type="button" class="icon" aria-pressed="false">
          <svg class="play" viewBox="0 0 16 16" aria-hidden="true"><path class="solid" d="M5 3.5l7 4.5-7 4.5z"/></svg>
          <svg class="pause" viewBox="0 0 16 16" aria-hidden="true"><path class="solid" d="M4.5 3.5h2.5v9H4.5zM9 3.5h2.5v9H9z"/></svg>
        </button>
        <button id="history" type="button" class="icon" title="Fight history">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 4.5V8l2.3 1.5M2.6 8a5.4 5.4 0 1 0 1.6-3.8M2.5 2.5v2.3h2.3"/></svg>
        </button>
        <span id="now" class="now scroll" data-tauri-drag-region><span id="now-text"></span></span>
        <span class="time" data-tauri-drag-region title="The fight's time, and when the boss goes berserk"><span id="clock">--:--</span> <span id="sub" class="dim"></span></span>
        <button id="arrange" type="button" class="icon" title="Arrange the overlay's widgets" aria-pressed="false">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 2.5h4.5v4.5H2.5zM9 2.5h4.5v4.5H9zM2.5 9h4.5v4.5H2.5zM9 9h4.5v4.5H9z"/></svg>
        </button>
        <button id="settings" type="button" class="icon" title="Settings">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4.5h6M11.5 4.5h2M2.5 11.5h2M7.5 11.5h6M10 3v3M6 10v3"/></svg>
        </button>
      </div>
    </footer>
  </main>
  <script src="launcher.js"></script>
</body>
</html>
