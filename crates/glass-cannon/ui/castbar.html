<!doctype html>
<html lang="en" class="widget">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glass Cannon cast bar</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="panel.css">
</head>
<body data-panel="cast-bar">
  <!-- Your cast on a bar of its own, with no box (the overlay puts no plate behind this
       widget): the skill's icon, its name and time, the bar filling as a charged skill
       charges, with a notch at each level. Built and laid out by castbar.js to the widget's
       size, in the look chosen in its settings; the vitals arcs' effects draw around it
       (arcfx.js). -->
  <main id="castbar" class="fx-host">
    <svg id="arcs" class="arcs castbar" aria-hidden="true"></svg>
    <svg id="cb-texts" class="cb-texts" aria-hidden="true"></svg>
    <div id="cb-icon" class="cb-icon" hidden></div>
  </main>
  <script src="theme.js"></script>
  <script src="panel.js"></script>
  <script src="arcfx.js"></script>
  <script src="castbar.js"></script>
</body>
</html>
