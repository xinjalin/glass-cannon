<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glass Cannon map</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="panel.css">
  <link rel="stylesheet" href="window.css">
  <link rel="stylesheet" href="petmap.css">
</head>
<body data-panel="petmap">
  <main id="panel">
    <header id="bar" data-tauri-drag-region>
      <span class="brand" data-tauri-drag-region>map</span>
      <span id="where" class="note" data-tauri-drag-region></span>
      <span class="lights">
        <button id="pin" type="button" class="light green" title="Kept on top · click to let other windows cover it" aria-label="Keep on top" aria-pressed="true"></button>
        <button id="close" type="button" class="light red" title="Close (Esc)" aria-label="Close"></button>
      </span>
    </header>
    <nav id="tabs" class="tabs" role="tablist" aria-label="Map"></nav>
    <div class="petmap-body">
      <div id="map-wrap" class="map-wrap">
        <canvas id="map" aria-label="Where the mobs that give pet souls spawn"></canvas>
        <div id="tip" class="map-tip" hidden></div>
        <p class="map-key note">scroll: zoom · drag: move · double-click: whole map · click a dot: pick it · click the map: none</p>
      </div>
      <aside class="pet-side">
        <nav id="mode" class="tabs side-mode" role="tablist" aria-label="What the map shows">
          <button type="button" role="tab" data-mode="pets" title="Where the mobs that give each pet's souls spawn">[pets]</button>
          <button type="button" role="tab" data-mode="gather" title="Where to gather ore, gems, herbs, logs, food and Odyle, and the collectables">[gathering]</button>
        </nav>
        <div class="side-head">
          <input id="search" class="side-search" type="search" placeholder="search a pet" title="Any pet, by name, genus or area (not only this map's)" autocomplete="off" spellcheck="false">
        </div>
        <!-- Which pets the list and the map show: by how far you've got with them, and by genus. -->
        <div id="pet-filters" class="side-filters">
          <span class="choice" role="radiogroup" aria-label="Which pets">
            <button type="button" role="radio" data-show="all" title="Every pet">[all]</button>
            <button type="button" role="radio" data-show="missing" title="Pets you have no copies of: never summoned">[missing]</button>
            <button type="button" role="radio" data-show="needed" title="Pets you still need: not summoned, or below max level">[needed]</button>
            <button type="button" role="radio" data-show="tracked" title="The pets you track (the pet tracker widget shows them)">[tracked]</button>
          </span>
          <span class="genus-filter" role="group" aria-label="Genus">
            <button type="button" data-genus="Fera" aria-pressed="true"><span class="genus-dot"></span>Fera</button>
            <button type="button" data-genus="Natura" aria-pressed="true"><span class="genus-dot"></span>Natura</button>
            <button type="button" data-genus="Cogni" aria-pressed="true"><span class="genus-dot"></span>Cogni</button>
            <button type="button" data-genus="Varian" aria-pressed="true"><span class="genus-dot"></span>Varian</button>
            <button type="button" data-genus="Special" aria-pressed="true"><span class="genus-dot"></span>Special</button>
          </span>
          <p id="pets-unknown" class="note" hidden>Your pets aren't known yet: log in (or change character) with the meter open, or enter a dungeon.</p>
        </div>
        <ul id="pets" class="scroll side-list"></ul>
        <div id="areas" class="side-areas note" hidden></div>
      </aside>
    </div>
  </main>
  <script src="theme.js"></script>
  <script src="window.js"></script>
  <script src="panel.js"></script>
  <script src="petmap.js"></script>
</body>
</html>
