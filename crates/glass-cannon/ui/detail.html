<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glass Cannon — player detail</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="detail.css">
</head>
<body>
  <main id="panel">
    <header id="bar" data-tauri-drag-region>
      <span id="title" class="brand" data-tauri-drag-region>player</span>
      <button id="close" type="button" class="close" title="Close (Esc)">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg>
      </button>
    </header>

    <div id="scroll">
      <section class="box">
        <h2>skills</h2>
        <table id="skills-table"></table>
      </section>

      <section class="box">
        <h2>rotation</h2>
        <div id="rotation-strip"></div>
      </section>

      <section class="box">
        <h2>buffs per skill</h2>
        <div id="buffs-list"></div>
      </section>

      <section class="box">
        <h2>buff timeline</h2>
        <div id="bufftimeline-list"></div>
      </section>
    </div>
  </main>
  <script src="theme.js"></script>
  <script src="detail.js"></script>
</body>
</html>
