<!doctype html>
<html lang="en" class="widget">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glass Cannon party frames settings</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="panel.css">
  <link rel="stylesheet" href="barsettings.css">
</head>
<!-- The party frames' settings, in a panel beside them while the overlay's arranged
     (partysettings.js): their layout and size, what each tile shows, and their order. -->
<body data-panel="party-settings">
  <main id="bs">
    <div class="bs-line"><span>layout</span>
      <span class="bs-choice" data-key="layout">
        <button type="button" data-v="grid" title="Tiles side by side">[grid]</button>
        <button type="button" data-v="list" title="A tile a row, the width of the widget">[list]</button>
      </span>
    </div>
    <div class="bs-line" data-only="grid"><span title="0: as many as fit">per row</span><input type="range" min="0" max="8" step="1" data-key="columns"><span class="bs-value" data-for="columns"></span></div>
    <div class="bs-line"><span>size</span><input type="range" min="70" max="200" step="10" data-key="size"><span class="bs-value" data-for="size"></span></div>
    <div class="bs-line"><span>HP shows</span>
      <span class="bs-choice" data-key="hp_text">
        <button type="button" data-v="percent">[percent]</button>
        <button type="button" data-v="value">[value]</button>
        <button type="button" data-v="none">[nothing]</button>
      </span>
    </div>
    <div class="bs-line"><span>names</span><button type="button" class="bs-toggle" data-key="names"></button></div>
    <div class="bs-line"><span>effects</span>
      <span class="bs-choice" data-key="effects">
        <button type="button" data-v="none" title="No buffs or debuffs on the tiles">[none]</button>
        <button type="button" data-v="mine" title="The buffs you put on them (your heals over time, your mantras)">[yours]</button>
        <button type="button" data-v="debuffs" title="Their debuffs (from mobs), rimmed red">[debuffs]</button>
        <button type="button" data-v="both" title="Both, debuffs first">[both]</button>
      </span>
    </div>
    <div class="bs-line"><span title="Yellow from half HP, red from a fifth">HP warning colours</span><button type="button" class="bs-toggle" data-key="hp_warn"></button></div>
    <div class="bs-line"><span title="HP lost stays a moment as a pale strip, then shrinks away">damage trail</span><button type="button" class="bs-toggle" data-key="trail"></button></div>
    <div class="bs-line"><span title="The one your target is attacking: outlined red, with ⚔">mark your target's target</span><button type="button" class="bs-toggle" data-key="target_mark"></button></div>
    <div class="bs-line"><span>order</span>
      <span class="bs-choice" data-key="sort">
        <button type="button" data-v="roster" title="As the party has them">[party]</button>
        <button type="button" data-v="hp" title="The lowest HP first (the dead last)">[lowest HP]</button>
        <button type="button" data-v="class" title="By class">[class]</button>
      </span>
    </div>
    <p class="bs-note">A dead member is greyed with ☠ until revived.</p>
  </main>
  <script src="theme.js"></script>
  <script src="panel.js"></script>
  <script src="partysettings.js"></script>
</body>
</html>
