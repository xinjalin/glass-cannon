<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glass Cannon party cooldowns</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="panel.css">
</head>
<body data-panel="party-cooldowns" data-fit>
  <main id="panel">
    <header id="bar" data-tauri-drag-region>
      <span class="brand" data-tauri-drag-region>─ party cooldowns</span>
      <button id="close" type="button" class="close" title="Close (Esc)">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg>
      </button>
    </header>
    <div class="scroll">
      <div id="members"></div>
      <p id="empty" class="empty">Your party's long cooldowns show here once they've used them: 60 s or more, and party buffs of 30 s or more.</p>
    </div>
    <p class="note hint">ready or time left · ◆ affects the party</p>
  </main>
  <script src="theme.js"></script>
  <script src="panel.js"></script>
  <script src="party-cooldowns.js"></script>
</body>
</html>
