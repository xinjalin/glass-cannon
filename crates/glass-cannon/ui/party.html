<!doctype html>
<html lang="en" class="widget">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glass Cannon party frames</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="panel.css">
</head>
<body data-panel="party">
  <!-- Party frames, as a grid of tiles: each member's HP fills their tile in their class's
       colour, with a thin MP strip under it. -->
  <main id="panel">
    <ol id="frames" class="frames"></ol>
    <p id="empty" class="empty">not in a party</p>
  </main>
  <script src="theme.js"></script>
  <script src="panel.js"></script>
  <script src="party.js"></script>
</body>
</html>
