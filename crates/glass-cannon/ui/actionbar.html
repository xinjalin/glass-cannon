<!doctype html>
<html lang="en" class="widget">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glass Cannon action bar</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="panel.css">
</head>
<body data-panel="action-bar" data-fit>
  <main id="panel">
    <!-- The skills chosen (settings → overlay → action bar), then the buffs on you. -->
    <ol id="ab-slots" class="ab-row"></ol>
    <ol id="ab-buffs" class="ab-row buffs"></ol>
    <p id="empty" class="empty" hidden></p>
  </main>
  <script src="theme.js"></script>
  <script src="panel.js"></script>
  <script src="actionbar.js"></script>
</body>
</html>
