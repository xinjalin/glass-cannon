<!doctype html>
<html lang="en" class="widget">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glass Cannon action bar</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="panel.css">
</head>
<!-- One action bar (actionbar.html?bar=N): no box, just what it shows, as big as that (it
     tells the overlay its width and height). Set up from the panel beside it while you
     arrange the overlay (⚙). -->
<body data-panel="action-bar" data-fit data-fit-width class="bar-page">
  <main id="panel" class="bar"></main>
  <script src="theme.js"></script>
  <script src="barid.js"></script>
  <script src="panel.js"></script>
  <script src="actionbar.js"></script>
</body>
</html>
