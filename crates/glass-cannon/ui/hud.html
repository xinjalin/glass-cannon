<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glass Cannon overlay</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="hud.css">
</head>
<body>
  <!-- The overlay: one transparent window over the game's picture. Each widget sits where
       you put it (launcher → arrange); the mouse goes through to the game except over the
       meter and the world timers. Widgets show as chosen in the settings: these three are
       always here (hidden or not); the side widgets (target, cooldowns, party cooldowns,
       world timers) are made as they're chosen. -->
  <div id="widgets">
    <section class="widget fades" data-widget="meter" data-label="meter" hidden>
      <iframe src="index.html" title="Meter"></iframe>
    </section>

    <!-- A boss's dangerous cast in the middle, as a card like the other alerts: what's
         happening (casting, landing, coming), the skill's name, and the time left. A few
         seconds before one is due, a heads-up; once over, it stays a moment, dimmed. -->
    <section class="widget passive" data-widget="boss-warnings" data-label="boss warnings" hidden>
      <div id="warning" hidden>
        <div id="warning-what"></div>
        <div id="warning-name"></div>
        <div id="warning-time"></div>
      </div>
    </section>

    <!-- The boss's next dangerous casts as bars counting down (from the last fight against it). -->
    <section class="widget passive fades" data-widget="boss-timers" data-label="boss timers" hidden>
      <ol id="timers"></ol>
    </section>

    <!-- An alert for each hidden cube in view (the game never says where you are as you
         move, so not which way it is). -->
    <section class="widget passive" data-widget="cubes" data-label="hidden cubes" hidden>
      <ol id="cubes"></ol>
    </section>
  </div>

  <!-- While arranging: a menu you can drag by its title, to show or hide each widget, pick
       the grid widgets snap to, reset the layout, or finish. -->
  <div id="arrange-menu" hidden>
    <header id="menu-head">
      <span class="menu-name">arrange</span>
      <span class="menu-hint">drag a widget to move it, its corner to resize · outlines show the most each can take</span>
    </header>
    <div class="menu-title">widgets</div>
    <div id="menu-widgets" class="menu-list"></div>
    <div class="menu-title">snap to grid</div>
    <div id="menu-grid" class="menu-row"></div>
    <div class="menu-row menu-actions">
      <button id="edit-reset" type="button">[ reset layout ]</button>
      <button id="edit-done" type="button" class="done">[ done ]</button>
    </div>
  </div>

  <script src="theme.js"></script>
  <script src="hud.js"></script>
</body>
</html>
