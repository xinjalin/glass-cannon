<!doctype html>
<html lang="en" class="widget">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glass Cannon pet tracker</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="panel.css">
</head>
<body data-panel="pets">
  <main id="panel">
    <div class="pets-head">
      <b>pets</b>
      <span id="pets-sync" class="note"></span>
      <button id="nearest" type="button" aria-pressed="false" title="Every pet you still need whose mobs are in view, tracked or not, nearest first">[nearest]</button>
    </div>
    <div class="scroll">
      <ol id="list" class="list"></ol>
      <p id="empty" class="empty" hidden></p>
    </div>
  </main>
  <script src="theme.js"></script>
  <script src="panel.js"></script>
  <script src="pets.js"></script>
</body>
</html>
