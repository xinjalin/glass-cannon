<!doctype html>
<html lang="en" class="widget">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glass Cannon farming</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="panel.css">
</head>
<!-- Only rows, and as tall as they are: what shows and which items is set in the panel
     beside it while the overlay's arranged (farmsettings.html). -->

    <p id="farm-time" class="farm-time" hidden></p>
    <ol id="list" class="list farm-list"></ol>
    <p id="more" class="note farm-more" hidden></p>
  </main>
  <script src="theme.js"></script>
  <script src="panel.js"></script>
  <script src="farm.js"></script>
</body>
</html>
