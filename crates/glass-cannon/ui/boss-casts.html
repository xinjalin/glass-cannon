<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glass Cannon boss casts</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="panel.css">
</head>
<body data-panel="boss-casts">
  <main id="panel">
    <header id="bar" data-tauri-drag-region>
      <span class="brand" data-tauri-drag-region>─ boss casts</span>
      <button id="close" type="button" class="close" title="Close (Esc)">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg>
      </button>
    </header>
    <div class="bc-head">
      <span id="bc-boss" class="bc-boss"></span>
      <span id="bc-time" class="note"></span>
      <button id="attacks" type="button" title="Show the boss's plain attacks and routine skills too (8 or more in a fight)">[frequent]</button>
    </div>
    <div class="scroll">
      <div id="next-box" hidden>
        <h2 class="section">coming up <span id="next-when" class="note"></span></h2>
        <ol id="next" class="list"></ol>
      </div>
      <h2 class="section">this fight</h2>
      <ol id="casts" class="list"></ol>
      <p id="empty" class="empty">No boss casts yet: they show here as a boss casts.</p>
    </div>
    <p class="note">newest first · ✕ stopped before it went off</p>
  </main>
  <script src="theme.js"></script>
  <script src="panel.js"></script>
  <script src="boss-casts.js"></script>
</body>
</html>
