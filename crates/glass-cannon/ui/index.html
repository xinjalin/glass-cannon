<!doctype html>
<html lang="en" class="widget">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glass Cannon</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- The meter, as a widget in the overlay (hud.html puts it in a frame): the target and
       the bars. Whose damage counts and what the rows show sit on the target's line; the
       other buttons appear beside them while the pointer is over the meter. -->
  <main id="panel">
    <!-- Optional strip with the local time and ping (settings → time & ping bar). -->
    <div id="info">
      <span id="info-time"></span>
      <span id="info-ping" title="Ping: the game's own round trip to its server"></span>
    </div>

    <div id="box" class="box">
      <div id="totals" hidden>
        <span id="target"></span>
      </div>
      <!-- In a live boss fight: its HP and when it goes berserk. -->
      <div id="boss-bar" hidden>
        <span class="hp-track"><span id="boss-hp-fill"></span></span>
        <span id="boss-hp-text"></span>
        <span id="enrage"></span>
        <span id="best" hidden></span>
      </div>
      <!-- Under it: what the boss is casting and when it lands, else what came next the
           last time you fought it. -->
      <div id="boss-cast" hidden>
        <span id="bc-name"></span>
        <span class="cast-track"><span id="bc-fill"></span></span>
        <span id="bc-time"></span>
      </div>
      <!-- Dummy mode (on a training dummy): the run's time, and your pace against your best
           run of that length. -->
      <div id="dummy-bar" hidden>
        <span id="dm-pace"></span>
        <span class="hp-track"><span id="dm-fill"></span></span>
        <span id="dm-time"></span>
      </div>
      <!-- World PvP (fighting players outside your party, as in the Abyss): kills and deaths,
           damage dealt and taken; the opponents on hover. -->
      <div id="pvp-bar" hidden>
        <span id="pvp-kd"></span>
        <span id="pvp-dmg"></span>
      </div>
      <ol id="rows"></ol>
      <p id="empty">waiting for a fight…</p>
    </div>

    <!-- People joining and leaving your party, and alerts: one line under the rows, so the
         rows never move. -->
    <div id="notice" hidden></div>

    <!-- Only shown when something needs attention (errors, missing data, dropped packets). -->
    <div id="status" hidden></div>

    <div id="float">
      <span id="actions">
        <button id="back" type="button" class="back" title="Back to the live fight" hidden>‹</button>
        <button id="analysis" type="button" title="Analyse this fight (or right-click a player)">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 13.5h11M4.5 11V8M7.5 11V4.5M10.5 11V6.5"/></svg>
        </button>
        <button id="end-fight" type="button" title="End this fight now (your next hit starts a new one)">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l5.5 4L4 12zM11.5 4v8"/></svg>
        </button>
        <button id="arrange" type="button" title="Arrange the overlay's widgets (Ctrl+Shift+F10)">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 2.5h4.5v4.5H2.5zM9 2.5h4.5v4.5H9zM2.5 9h4.5v4.5H2.5zM9 9h4.5v4.5H9z"/></svg>
        </button>
        <button id="history" type="button" title="Fight history">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 4.5V8l2.3 1.5M2.6 8a5.4 5.4 0 1 0 1.6-3.8M2.5 2.5v2.3h2.3"/></svg>
        </button>
        <button id="settings" type="button" title="Settings">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11"/></svg>
        </button>
      </span>
      <button id="scope" type="button" class="scope-switch"></button>
      <button id="view" type="button" class="view-switch"></button>
    </div>
  </main>
  <script src="theme.js"></script>
  <script src="schedule.js"></script>
  <script src="app.js"></script>
</body>
</html>
