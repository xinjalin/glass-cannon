<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glass Cannon</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="panel">
    <!-- Optional strip with the local time and ping (settings → time & ping bar). -->
    <div id="info" data-tauri-drag-region>
      <span id="info-time" data-tauri-drag-region></span>
      <span id="info-ping" title="Ping: the game's own round trip to its server" data-tauri-drag-region></span>
    </div>

    <header id="bar" data-tauri-drag-region>
      <span class="brand" data-tauri-drag-region>─ glass cannon</span>
      <span id="dot" class="dot" data-tauri-drag-region></span>
      <span id="fight" data-tauri-drag-region></span>
      <span id="ping" title="Ping: the game's own round trip to its server" hidden></span>
      <nav>
        <button id="scope" type="button" title="Whose damage counts: auto, mine, party or all">mine</button>
        <button id="analysis" type="button" title="Analyse this fight (or right-click a player)">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 13.5h11M4.5 11V8M7.5 11V4.5M10.5 11V6.5"/></svg>
        </button>
        <button id="end-fight" type="button" title="End this fight now (your next hit starts a new one)">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l5.5 4L4 12zM11.5 4v8"/></svg>
        </button>
        <button id="history" type="button" title="Fight history">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 4.5V8l2.3 1.5M2.6 8a5.4 5.4 0 1 0 1.6-3.8M2.5 2.5v2.3h2.3"/></svg>
        </button>
        <button id="reset" type="button" title="Reset">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8a5 5 0 1 0 1.6-3.7M3 2.5v2.8h2.8"/></svg>
        </button>
        <button id="settings" type="button" title="Settings">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11"/></svg>
        </button>
        <button id="pin" type="button" class="on" title="Keep on top">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 2h4l-.5 4 2.5 2.5H4L6.5 6zM8 8.5V14"/></svg>
        </button>
        <button id="min" type="button" title="Minimise">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 8h8"/></svg>
        </button>
        <button id="close" type="button" class="close" title="Close Glass Cannon">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg>
        </button>
      </nav>
    </header>

    <fieldset id="box" class="box">
      <legend id="legend">
        <button id="back" type="button" class="back" title="Back" hidden>‹</button>
        <span id="legend-text">fight</span>
        <span id="clock"></span>
        <button id="view" type="button" class="view-switch"></button>
      </legend>
      <div id="totals" hidden>
        <span id="target"></span>
        <span id="total"></span>
      </div>
      <!-- In a live boss fight: its HP and when it goes berserk. -->
      <div id="boss-bar" hidden>
        <span class="hp-track"><span id="boss-hp-fill"></span></span>
        <span id="boss-hp-text"></span>
        <span id="enrage"></span>
        <span id="best" hidden></span>
      </div>
      <!-- Under it: what the boss is casting and when it lands, else what came next the
           last time you fought it. -->
      <div id="boss-cast" hidden>
        <span id="bc-name"></span>
        <span class="cast-track"><span id="bc-fill"></span></span>
        <span id="bc-time"></span>
      </div>
      <ol id="rows"></ol>
      <p id="empty">waiting for a fight…</p>
    </fieldset>

    <!-- People joining and leaving your party, and alerts: one line on the box's top
         border (under the rows in minimal mode), so the rows never move. -->
    <div id="notice" hidden></div>

    <!-- Only shown when something needs attention (errors, missing data, dropped packets). -->
    <div id="status" hidden></div>

    <!-- Minimal mode has no title bar: these appear while the pointer is over the meter. -->
    <div id="float">
      <button id="f-back" type="button" class="back" title="Back" hidden>‹</button>
      <button id="f-view" type="button" class="view-switch"></button>
      <button id="f-end-fight" type="button" title="End this fight now (your next hit starts a new one)">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l5.5 4L4 12zM11.5 4v8"/></svg>
      </button>
      <button id="f-history" type="button" title="Fight history">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 4.5V8l2.3 1.5M2.6 8a5.4 5.4 0 1 0 1.6-3.8M2.5 2.5v2.3h2.3"/></svg>
      </button>
      <button id="f-settings" type="button" title="Settings">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11"/></svg>
      </button>
      <button id="f-close" type="button" class="close" title="Close Glass Cannon">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg>
      </button>
    </div>
    <!-- Locks the meter: clicks go through to the game. While locked, this is the only
         part of the meter that takes the mouse. -->
    <button id="lock" type="button" title="Lock: let clicks through to the game">
      <svg class="open" viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="7.5" width="9" height="6" rx="1"/><path d="M5.5 7.5V5a2.5 2.5 0 0 1 4.9-.7"/></svg>
      <svg class="shut" viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="7.5" width="9" height="6" rx="1"/><path d="M5.5 7.5V5a2.5 2.5 0 0 1 5 0v2.5"/></svg>
    </button>
  </main>
  <script src="theme.js"></script>
  <script src="schedule.js"></script>
  <script src="app.js"></script>
</body>
</html>
