<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glass Cannon attempts</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="panel.css">
  <link rel="stylesheet" href="window.css">
</head>
<body data-panel="attempts">
  <main id="panel">
    <header id="bar" data-tauri-drag-region>
      <span class="brand" data-tauri-drag-region>attempts</span>
      <span id="count" class="note" data-tauri-drag-region></span>
      <span class="lights">
        <button id="min" type="button" class="light yellow" title="Minimise" aria-label="Minimise"></button>
        <button id="pin" type="button" class="light green" title="Kept on top · click to let other windows cover it" aria-label="Keep on top" aria-pressed="true"></button>
        <button id="close" type="button" class="light red" title="Close (Esc)" aria-label="Close"></button>
      </span>
    </header>
    <!-- One tab per character; then which content. -->
    <nav id="characters" class="tabs" role="tablist" aria-label="Character"></nav>
    <nav id="kinds" class="tabs" role="tablist" aria-label="Show">
      <button type="button" role="tab" data-kind="all">[all]</button>
      <button type="button" role="tab" data-kind="raids" title="Sanctuaries: Abyssal Forge: Ludra and the others">[raids]</button>
      <button type="button" role="tab" data-kind="dungeons" title="Expeditions and Transcendence">[dungeons]</button>
      <button type="button" role="tab" data-kind="sealed" title="Sealed Dungeons and Strongholds: cleared once each, solo">[sealed &amp; strongholds]</button>
      <button type="button" role="tab" data-kind="other" title="Bosses outside dungeons: field bosses, Dimensional Invasions and others">[field &amp; other]</button>
    </nav>
    <p id="totals" class="att-totals"></p>
    <div class="scroll">
      <div id="list"></div>
      <p id="empty" class="empty" hidden></p>
    </div>
    <div class="history-foot">
      <p id="hint" class="note">every boss kill and wipe, from all your fights · kept when the history is cleared</p>
      <span class="foot-buttons">
        <button id="clear" type="button">[clear]</button>
      </span>
      <span id="clear-ask" class="clear-ask" hidden>
        <span id="clear-what"></span>
        <button id="clear-yes" type="button" class="danger">[yes]</button>
        <button id="clear-no" type="button">[no]</button>
      </span>
    </div>
  </main>
  <script src="theme.js"></script>
  <script src="window.js"></script>
  <script src="panel.js"></script>
  <script src="attempts.js"></script>
</body>
</html>
