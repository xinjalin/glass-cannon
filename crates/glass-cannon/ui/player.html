<!doctype html>
<html lang="en" class="widget">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glass Cannon player bars</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="panel.css">
</head>
<body data-panel="player">
  <!-- Your HP and MP as two thin bars, and a cast bar while you cast: minimal, to sit
       under your character. -->
  <main id="panel" class="player-bars">
    <div class="pb hp"><span class="pb-fill"></span><span class="pb-text"></span></div>
    <div class="pb mp"><span class="pb-fill"></span><span class="pb-text"></span></div>
    <div class="pb cast" hidden><span class="pb-fill"></span><span class="pb-text"></span><span class="pb-time"></span></div>
    <p id="empty" class="note">your HP and MP show once you're in game</p>
  </main>
  <script src="theme.js"></script>
  <script src="panel.js"></script>
  <script src="player.js"></script>
</body>
</html>
