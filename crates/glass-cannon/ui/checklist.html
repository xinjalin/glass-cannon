<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glass Cannon checklist</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="panel.css">
  <link rel="stylesheet" href="window.css">
</head>
<body data-panel="checklist">
  <main id="panel">
    <header id="bar" data-tauri-drag-region>
      <span class="brand" data-tauri-drag-region>checklist</span>
      <span id="count" class="note" data-tauri-drag-region></span>
      <span class="lights">
        <button id="pin" type="button" class="light green" title="Kept on top · click to let other windows cover it" aria-label="Keep on top" aria-pressed="true"></button>
        <button id="close" type="button" class="light red" title="Close (Esc)" aria-label="Close"></button>
      </span>
    </header>
    <!-- One tab per character. -->
    <nav id="characters" class="tabs" role="tablist" aria-label="Character"></nav>
    <div class="scroll">
      <section class="ck-box">
        <h2 class="ck-head">Odyle energy</h2>
        <div id="energy" class="ck-energy"></div>
      </section>
      <section class="ck-box">
        <h2 class="ck-head">weekly sources <span id="week" class="note"></span></h2>
        <ul id="sources" class="ck-list"></ul>
      </section>
      <p id="empty" class="empty" hidden></p>
    </div>
    <div class="history-foot">
      <p id="hint" class="note">from the game: log in, or open a shop, with the meter open · the rest: tick it by hand</p>
    </div>
  </main>
  <script src="theme.js"></script>
  <script src="window.js"></script>
  <script src="panel.js"></script>
  <script src="checklist.js"></script>
</body>
</html>
