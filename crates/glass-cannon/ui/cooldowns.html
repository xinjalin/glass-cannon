<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glass Cannon cooldowns</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="panel.css">
</head>
<body data-panel="cooldowns" data-fit>
  <main id="panel">
    <header id="bar" data-tauri-drag-region>
      <span class="brand" data-tauri-drag-region>─ cooldowns</span>
      <button id="close" type="button" class="close" title="Close (Esc)">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg>
      </button>
    </header>
    <div class="scroll">
      <ol id="list" class="list"></ol>
      <p id="empty" class="empty">all your skills are ready</p>
    </div>
  </main>
  <script src="theme.js"></script>
  <script src="panel.js"></script>
  <script src="cooldowns.js"></script>
</body>
</html>
