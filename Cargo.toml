[workspace]
resolver = "2"
members = ["crates/meter-core", "crates/packet-lab", "crates/glass-cannon"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT"
authors = ["Xinjalin"]

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
